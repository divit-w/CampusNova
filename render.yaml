services:
  - type: web
    name: campusnova-api-staging
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: campusnova_staging
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /app/runtime/chroma
      - key: UPLOADS_DIR
        value: /app/runtime/uploads
      - key: SEED_DEMO_DATA
        value: "false"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: campusnova-runtime-staging
      mountPath: /app/runtime
      sizeGB: 1
